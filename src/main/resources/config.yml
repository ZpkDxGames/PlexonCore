schema-version: 1

text:
  placeholder-rendering:
    default: SAFE
    allow-legacy: true
    allow-minimessage: true

executor:
  # Executor sizing is validated on reload but takes effect only after restart.
  worker-threads: 2
  queue-capacity: 4096
  io-threads: 1
  io-queue-capacity: 2048

origin-persistence:
  # Coalesced Last-Write-Wins persistence. These settings are restart-required.
  flush-interval-ms: 500
  batch-size: 512
  pressure-threshold: 2048
  max-retries: 6
