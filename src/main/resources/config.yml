schema-version: 1

text:
  placeholder-rendering:
    default: SAFE
    allow-legacy: true
    allow-minimessage: true

gui:
  click-sound: UI_BUTTON_CLICK

diagnostics:
  verbose-startup: false

executor:
  # Bounded CPU lane. Default is selected from available processors when omitted by older configs.
  worker-threads: 2
  queue-capacity: 4096
  # Separate bounded lane for blocking IO/query preparation. SQLite writes remain serialized per database.
  io-threads: 1
  io-queue-capacity: 2048
