name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify release build
        run: mvn -B -ntp clean verify
      - name: Generate checksum
        run: sha256sum target/PlexonCore-1.0.0.jar > SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PlexonCore 1.0.0
          body_path: .release/1.0.0.md
          files: |
            target/PlexonCore-1.0.0.jar
            SHA256SUMS.txt
