name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Read project version
        id: project
        shell: bash
        run: echo "version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_OUTPUT"
      - name: Verify tag matches project version
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v${{ steps.project.outputs.version }}"
      - name: Verify release build
        run: mvn -B -ntp clean verify
      - name: Verify distribution
        shell: bash
        run: |
          set -euo pipefail
          jar_path="target/PlexonCore-${{ steps.project.outputs.version }}.jar"
          test -f "${jar_path}"
          jar tf "${jar_path}" | grep -q 'plugin.yml'
          jar tf "${jar_path}" | grep -q 'com/zpkdxgames/plexoncore/origin/BlockOriginService.class'
      - name: Generate checksum
        shell: bash
        run: sha256sum "target/PlexonCore-${{ steps.project.outputs.version }}.jar" > SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PlexonCore ${{ steps.project.outputs.version }}
          generate_release_notes: true
          files: |
            target/PlexonCore-${{ steps.project.outputs.version }}.jar
            SHA256SUMS.txt
