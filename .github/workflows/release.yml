name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Read project version
        id: project
        shell: bash
        run: echo "version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_OUTPUT"
      - name: Verify stable release boundary
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.project.outputs.version }}"
          test "${GITHUB_REF_NAME}" = "v${version}"
          case "${version}" in
            *-*) echo "Generic stable release workflow refuses prerelease versions: ${version}" >&2; exit 1 ;;
          esac
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          test -f ".release/${version}.md"
      - name: Verify release build
        run: mvn -B -ntp clean verify
      - name: Verify distribution contract
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.project.outputs.version }}"
          jar_path="target/PlexonCore-${version}.jar"
          test -s "${jar_path}"
          jar tf "${jar_path}" > target/jar-contents.txt
          grep -qx 'plugin.yml' target/jar-contents.txt
          grep -qx 'com/zpkdxgames/plexoncore/PlexonCorePlugin.class' target/jar-contents.txt
          grep -qx 'com/zpkdxgames/plexoncore/origin/BlockOriginService.class' target/jar-contents.txt
          grep -qx 'org/sqlite/JDBC.class' target/jar-contents.txt
          for prefix in 'org/bukkit/' 'io/papermc/' 'net/kyori/adventure/'; do
            if grep -q "^${prefix}" target/jar-contents.txt; then
              echo "Server API must not be shaded into PlexonCore: ${prefix}" >&2
              exit 1
            fi
          done
          unzip -p "${jar_path}" plugin.yml | sed -n 's/^version:[[:space:]]*//p' | head -n 1 | tr -d " '\"\r" | grep -qx "${version}"
          javap -verbose -classpath "${jar_path}" com.zpkdxgames.plexoncore.PlexonCorePlugin | grep -q 'major version: 69'
          grep -q '<paper.version>26.2.build.121-stable</paper.version>' pom.xml
          sha256sum "${jar_path}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish GitHub stable release
        uses: softprops/action-gh-release@v2
        with:
          name: PlexonCore ${{ steps.project.outputs.version }}
          prerelease: false
          body_path: .release/${{ steps.project.outputs.version }}.md
          files: |
            target/PlexonCore-${{ steps.project.outputs.version }}.jar
            SHA256SUMS.txt
