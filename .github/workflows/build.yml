name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Read project version
        id: project
        shell: bash
        run: echo "version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_OUTPUT"
      - name: Verify
        run: mvn -B -ntp clean verify
      - name: Structural checks
        shell: bash
        run: |
          set -euo pipefail
          jar_path="target/PlexonCore-${{ steps.project.outputs.version }}.jar"
          test -f src/main/resources/plugin.yml
          test -f "${jar_path}"
          jar tf "${jar_path}" | grep -q 'com/zpkdxgames/plexoncore/PlexonCorePlugin.class'
          jar tf "${jar_path}" | grep -q 'com/zpkdxgames/plexoncore/origin/BlockOriginService.class'
          jar tf "${jar_path}" | grep -q 'plugin.yml'
          sha256sum "${jar_path}" > SHA256SUMS.txt
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: PlexonCore-${{ steps.project.outputs.version }}
          path: |
            target/PlexonCore-${{ steps.project.outputs.version }}.jar
            SHA256SUMS.txt
