name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify
        run: mvn -B -ntp clean verify
      - name: Structural checks
        run: |
          test -f src/main/resources/plugin.yml
          test -f target/PlexonCore-2.0.0.jar
          jar tf target/PlexonCore-2.0.0.jar | grep -q 'com/zpkdxgames/plexoncore/PlexonCorePlugin.class'
          jar tf target/PlexonCore-2.0.0.jar | grep -q 'plugin.yml'
          sha256sum target/PlexonCore-2.0.0.jar > SHA256SUMS.txt
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: PlexonCore-2.0.0
          path: |
            target/PlexonCore-2.0.0.jar
            SHA256SUMS.txt
