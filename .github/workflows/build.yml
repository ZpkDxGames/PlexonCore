name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Resolve project version
        id: version
        shell: bash
        run: |
          VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "jar=target/PlexonCore-${VERSION}.jar" >> "$GITHUB_OUTPUT"
      - name: Verify
        run: mvn -B -ntp clean verify
      - name: Structural checks
        shell: bash
        run: |
          JAR="${{ steps.version.outputs.jar }}"
          test -f src/main/resources/plugin.yml
          test -f "$JAR"
          jar tf "$JAR" | grep -q 'com/zpkdxgames/plexoncore/PlexonCorePlugin.class'
          jar tf "$JAR" | grep -q 'plugin.yml'
          sha256sum "$JAR" > SHA256SUMS.txt
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: PlexonCore-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.version.outputs.jar }}
            SHA256SUMS.txt
