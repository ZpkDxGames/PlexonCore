name: Publish PlexonCore 2.0.1 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-2.0.1-once.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Guard exact version and existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          test "$version" = "2.0.1"
          if gh release view v2.0.1 >/dev/null 2>&1; then
            echo "PlexonCore v2.0.1 already exists; nothing to publish."
            exit 0
          fi
      - name: Verify and build exact main commit
        run: mvn -B -ntp clean verify
      - name: Verify distribution
        shell: bash
        run: |
          set -euo pipefail
          jar_path=target/PlexonCore-2.0.1.jar
          test -s "$jar_path"
          jar tf "$jar_path" | grep -qx 'plugin.yml'
          jar tf "$jar_path" | grep -qx 'com/zpkdxgames/plexoncore/PlexonCorePlugin.class'
          sha256sum "$jar_path" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish v2.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.0.1 >/dev/null 2>&1; then exit 0; fi
          gh release create v2.0.1 \
            target/PlexonCore-2.0.1.jar \
            SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --title 'PlexonCore 2.0.1' \
            --notes-file .release/2.0.1.md
