name: Publish PlexonCore 2.0.3 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-2.0.3-once.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Guard exact version
        shell: bash
        run: |
          set -euo pipefail
          test "$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" = "2.0.3"
      - name: Verify and build exact main commit
        run: mvn -B -ntp clean verify
      - name: Verify distribution
        shell: bash
        run: |
          set -euo pipefail
          jar_path=target/PlexonCore-2.0.3.jar
          test -s "$jar_path"
          jar tf "$jar_path" | grep -qx 'plugin.yml'
          jar tf "$jar_path" | grep -qx 'com/zpkdxgames/plexoncore/PlexonCorePlugin.class'
          jar tf "$jar_path" | grep -qx 'com/zpkdxgames/plexoncore/player/PlayerWatchService.class'
          sha256sum "$jar_path" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish v2.0.3
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.0.3 >/dev/null 2>&1; then exit 0; fi
          gh release create v2.0.3 \
            target/PlexonCore-2.0.3.jar \
            SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --title 'PlexonCore 2.0.3' \
            --notes-file .release/2.0.3.md
