name: Publish 2.0.0

on:
  push:
    branches:
      - main
    paths:
      - '.release/2.0.0.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify release build
        run: mvn -B -ntp clean verify
      - name: Verify packaged plugin
        run: |
          test -f target/PlexonCore-2.0.0.jar
          jar tf target/PlexonCore-2.0.0.jar | grep -q 'com/zpkdxgames/plexoncore/PlexonCorePlugin.class'
          jar tf target/PlexonCore-2.0.0.jar | grep -q 'plugin.yml'
          sha256sum target/PlexonCore-2.0.0.jar > SHA256SUMS.txt
      - name: Publish v2.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.0.0 >/dev/null 2>&1; then
            gh release upload v2.0.0 target/PlexonCore-2.0.0.jar SHA256SUMS.txt --clobber
          else
            gh release create v2.0.0 \
              target/PlexonCore-2.0.0.jar SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title 'PlexonCore 2.0.0' \
              --notes-file .release/2.0.0.md
          fi
